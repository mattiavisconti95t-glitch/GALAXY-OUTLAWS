<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#160a0b"><title>GALAXY OUTLAWS</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#080507;color:#ffebd1;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}button{font:inherit;cursor:pointer;color:inherit}#app{width:100vw;height:100dvh;position:relative;overflow:hidden;background:#100809}.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s,transform .8s;transform:scale(1.06)}.screen.active{opacity:1;visibility:visible;transform:scale(1)}#menu{background:url('./menu-bg.jpg') center center/100% 100% no-repeat}#board{background:url('./board-bg.jpg') center center/100% 100% no-repeat}#menu:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 75%,#0004)}.hit{position:absolute;border:0;background:transparent;z-index:2}#newBtn{left:14%;top:61%;width:73%;height:11%}#continueBtn{left:14%;top:72.5%;width:73%;height:8%}#settingsBtn{left:14%;top:82%;width:73%;height:9%}#subMenu{position:absolute;left:15%;right:15%;top:55%;z-index:6;background:#150b0af2;border:2px solid #d74b27;box-shadow:0 0 35px #ff300b80;border-radius:12px;padding:16px;text-align:center;display:none}#subMenu.show{display:block}#subMenu h2{font-size:18px;margin:0 0 12px;color:#fce2af}#subMenu button,.uiBtn{background:linear-gradient(#7d2419,#290c0b);border:1px solid #ff763b;border-radius:8px;padding:11px 16px;margin:5px;font-weight:900;box-shadow:0 0 12px #d63a1c66}#cape{position:absolute;left:19%;top:38%;width:40%;height:21%;clip-path:polygon(52% 0,90% 18%,100% 48%,82% 93%,32% 100%,0 75%,16% 38%);background:linear-gradient(110deg,transparent 35%,#f5332022 55%,transparent 70%);transform-origin:65% 0;animation:cape 2.8s ease-in-out infinite alternate;pointer-events:none;mix-blend-mode:screen}@keyframes cape{from{transform:skewX(-3deg) rotate(-1deg)}to{transform:skewX(5deg) rotate(2deg)}}
#topHud{position:absolute;top:3.5%;left:3%;right:3%;display:flex;justify-content:space-between;align-items:center;z-index:4;font-weight:900;text-shadow:0 2px 4px black;font-size:12px}#backMenu{background:#140909c9;border:1px solid #b94627;border-radius:8px;padding:6px}#wantedCard{position:absolute;top:24.7%;left:40.1%;width:19.8%;height:18.7%;object-fit:fill;filter:drop-shadow(0 3px 5px #000);transition:transform .3s}#wantedHealth{position:absolute;top:20.3%;left:33%;width:34%;height:3.4%;z-index:2}#hunterHud{position:absolute;top:3.4%;left:22%;right:22%;display:flex;gap:4px;justify-content:center;z-index:3} .health{border:1px solid #f58b42;border-radius:5px;background:#200a0de8;box-shadow:0 0 7px #ff3d19a8;overflow:hidden;position:relative;text-align:center;font-size:12px;font-weight:900;white-space:nowrap}.health .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#a71919,#ec552a);transition:width .45s}.health span{position:relative;z-index:1;text-shadow:0 1px 3px #000}#wantedHealth{font-size:15px}#hunterHud .health{flex:1;min-width:0;font-size:10px;padding:3px 0}#played{position:absolute;left:6.4%;width:87.2%;top:53.8%;height:13.7%;display:grid;grid-template-columns:repeat(4,1fr);gap:3.2%;z-index:3;pointer-events:none}.playedCard{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;perspective:500px}.playedCard img{width:100%;height:100%;object-fit:fill;border-radius:5px;box-shadow:0 4px 9px #0009;transition:transform .45s}.playedCard.reveal img{animation:flip .7s ease both}.playedCard.fire img{transform:translateY(-13px) scale(1.08);filter:drop-shadow(0 0 10px #ffdb7c)}@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}#deckCard{position:absolute;left:22.2%;top:74.3%;width:19%;height:13.4%;object-fit:fill;filter:drop-shadow(0 2px 4px #000);z-index:2}#discardCard{position:absolute;left:60%;top:74.3%;width:19%;height:13.4%;object-fit:fill;opacity:.88;z-index:2}#handArea{position:absolute;bottom:0;left:0;right:0;height:20%;z-index:8;background:linear-gradient(transparent,#0b070be8 28%,#110b0ff2);display:flex;flex-direction:column;align-items:center;justify-content:end;padding-bottom:max(7px,env(safe-area-inset-bottom))}#handTitle{font-size:11px;letter-spacing:2px;text-shadow:0 1px 3px black}#handCards{width:100%;height:77%;display:flex;justify-content:center;align-items:end;gap:0;overflow-x:auto;overflow-y:hidden;padding:0 6px 2px}.handCard{flex:0 0 min(19vw,80px);height:95%;margin-left:-3px;background:none;border:0;padding:0;transition:transform .2s}.handCard img{width:100%;height:100%;object-fit:fill;border-radius:5px;box-shadow:0 0 8px #000}.handCard.selected{transform:translateY(-12px)}.handCard.selected img{outline:2px solid #ffdf76}#playBtn{position:absolute;right:2%;bottom:20.3%;z-index:9;background:linear-gradient(#a92815,#42100c);border:2px solid #ff8c4a;border-radius:8px;font-weight:900;padding:8px 12px;font-size:11px;box-shadow:0 0 14px #f34d23aa}#playBtn:disabled{opacity:.4}#status{position:absolute;left:3%;right:3%;top:69%;text-align:center;font-weight:800;font-size:12px;text-shadow:0 2px 5px #000;z-index:6;pointer-events:none}#effectLayer{position:absolute;inset:0;z-index:12;pointer-events:none}.bullet{position:absolute;width:9px;height:18px;border-radius:50%;background:#fff8b0;box-shadow:0 0 15px 6px #ff731b;transform:translate(-50%,-50%);animation:bullet .32s linear forwards}@keyframes bullet{to{left:50%;top:33%;opacity:0;transform:translate(-50%,-50%) scale(.4)}}.impact{position:absolute;left:50%;top:33%;font-size:30px;color:#fff0a0;text-shadow:0 0 15px red;animation:impact .5s forwards}@keyframes impact{to{transform:scale(2);opacity:0}}#modal{position:absolute;inset:0;background:#000b;z-index:30;display:none;align-items:center;justify-content:center;padding:20px}#modal.show{display:flex}#modalBox{background:#1b0c0cf5;border:2px solid #ee6a30;border-radius:12px;padding:20px;text-align:center;width:100%;max-width:370px;box-shadow:0 0 35px #b9361b80}#modalBox h2{margin-top:0}#modalBox p{white-space:pre-line}#settings{position:absolute;inset:0;background:#080509e8;z-index:15;display:none;align-items:center;justify-content:center}#settings.show{display:flex}#settings>div{background:#281212;padding:22px;border:1px solid #d95732;border-radius:12px}#toast{position:absolute;top:11%;left:5%;right:5%;text-align:center;z-index:25;color:#fff5da;font-weight:900;text-shadow:0 2px 6px black;pointer-events:none}#dealCard{position:absolute;width:17%;height:12%;z-index:20;display:none;pointer-events:none;transition:transform .45s ease,opacity .45s}#dealCard img{width:100%;height:100%}@media (min-aspect-ratio: 3/4){#app{width:min(100vw,65vh);margin:auto}body{background:#080507}}@media (prefers-reduced-motion:reduce){#cape{animation:none}}
</style></head><body><div id="app"><section id="menu" class="screen active"><div id="cape"></div><button id="newBtn" class="hit" aria-label="Nuova partita"></button><button id="continueBtn" class="hit" aria-label="Continua"></button><button id="settingsBtn" class="hit" aria-label="Impostazioni"></button><div id="subMenu"><h2>QUANTI CACCIATORI?</h2><div><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button></div><button id="cancelMenu" class="uiBtn">ANNULLA</button></div></section><section id="board" class="screen"><div id="topHud"><button id="backMenu">☰</button><span id="round">TAGLIA 1/20</span><span id="score">0 ¢</span></div><div id="hunterHud"></div><div id="wantedHealth" class="health"></div><img id="wantedCard" alt="Ricercato"><div id="played"></div><img id="deckCard" alt="Mazzo azioni"><img id="discardCard" alt="Scarti"><div id="status"></div><button id="playBtn" disabled>GIOCA COPERTA</button><div id="handArea"><div id="handTitle">LA TUA MANO</div><div id="handCards"></div></div><div id="effectLayer"></div><div id="toast"></div><div id="dealCard"><img></div></section><div id="settings"><div><h2>IMPOSTAZIONI</h2><label><input type="checkbox" id="animToggle" checked> Animazioni attive</label><p><button id="closeSettings" class="uiBtn">CHIUDI</button></p></div></div><div id="modal"><div id="modalBox"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="modalButton" class="uiBtn">CONTINUA</button></div></div></div><script>
const hunters=['JAX','ZYRA','K-17','BRUGG'];const wantedData=[['KRAAG',700,1],['NIB',650,1],['SIXX',750,1],['ZERA',750,1],['VILT',800,1],['SKAR',650,1],['MURK',850,1],['KIP',950,1],['NOVA',750,1],['RAX',750,1],['KORV',800,1],['GRIMM',850,1],['SHARD',800,1],['BRAX',700,1],['GORR',800,1],['MARA',850,2],['THORN',800,2],['VEXA',900,2],['VEX',900,2],['OXX',900,2]];
const $=s=>document.querySelector(s),img=(type,name)=>`./${type}_${String(name).toLowerCase().replaceAll('-','')}.webp`;let selected=-1,state=null,modalNext=null,locked=false,anim=true;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const makeDeck=()=>shuffle([...Array.from({length:8},()=>({type:'attack',speed:6,power:1})),...Array.from({length:8},()=>({type:'attack',speed:5,power:2})),...Array.from({length:8},()=>({type:'attack',speed:4,power:3})),...Array.from({length:8},()=>({type:'attack',speed:3,power:4})),...Array.from({length:8},()=>({type:'attack',speed:2,power:5})),...Array.from({length:4},()=>({type:'attack',speed:1,power:6})),...Array.from({length:14},()=>({type:'heal',speed:0,power:1})),...Array.from({length:6},()=>({type:'heal',speed:0,power:2}))]);
// The PDF attack deck has 40 cards: six groups, counts 5/8/8/8/7/4 (speed 6..1).
const attackDeck=()=>shuffle([...[6,5,4,3,2,1].flatMap((s,i)=>Array.from({length:[5,8,8,8,7,4][i]},()=>({type:'attack',speed:s,power:7-s}))),...Array.from({length:14},()=>({type:'heal',speed:0,power:1})),...Array.from({length:6},()=>({type:'heal',speed:0,power:2}))]);

const wait=ms=>new Promise(r=>setTimeout(r,anim?ms:20));
const showScreen=name=>{document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===name))};
function draw(){if(!state.deck.length&&state.discard.length){state.deck=shuffle(state.discard);state.discard=[]}return state.deck.pop()||null}
function refill(p){while(p.hand.length<p.hp){const c=draw();if(!c)break;p.hand.push(c)}}
function save(){try{localStorage.setItem('galaxy-outlaws-save-v5',JSON.stringify(state))}catch(e){}}
function health(name,hp,max){return `<div class="fill" style="width:${Math.max(0,hp/max*100)}%"></div><span>${name} ♥ ${hp}/${max}</span>`}
function status(s){$('#status').textContent=s}
function toast(s){$('#toast').textContent=s}
function render(){if(!state||!state.current)return;$('#round').textContent=`TAGLIA ${state.round}/20`;$('#score').textContent=`${state.players[0].credits} ¢ · ${state.players[0].bounties} TAGLIE`;$('#wantedCard').src=img('wanted',state.current.name);$('#wantedHealth').innerHTML=health(state.current.name,state.current.hp,state.current.maxHp);$('#hunterHud').innerHTML=state.players.map((p,i)=>`<div class="health">${health(i===0?'TU':p.name,p.hp,5)}</div>`).join('');const hand=$('#handCards');hand.replaceChildren();state.players[0].hand.forEach((c,i)=>{const b=document.createElement('button');b.className='handCard'+(selected===i?' selected':'');const pic=document.createElement('img');pic.src=img(c.type,c.type==='heal'?c.power:c.speed);pic.alt=c.type==='heal'?`Cura ${c.power}`:`Velocità ${c.speed} danno ${c.power}`;b.append(pic);b.onclick=()=>{if(locked)return;selected=i;render()};hand.append(b)});$('#playBtn').disabled=locked||selected<0||state.over||state.players[0].hp<=0;save()}
function modal(title,message,button='CONTINUA'){return new Promise(resolve=>{$('#modalTitle').textContent=title;$('#modalText').textContent=message;$('#modalButton').textContent=button;$('#modal').classList.add('show');$('#modalButton').onclick=()=>{$('#modal').classList.remove('show');resolve()}})}
function endGame(reason){state.over=true;render();const ranking=[...state.players].sort((a,b)=>b.credits-a.credits);modal('FINE PARTITA',reason+'\n'+ranking.map(p=>p.name+': '+p.credits+' crediti').join('\n'),'MENU').then(()=>showScreen('menu'));save()}
function setSlots(entries,faceDown=true){const grid=$('#played');grid.replaceChildren();const n=state.players.length;const start=n===2?1:0;for(let i=0;i<4;i++){const box=document.createElement('div');box.className='playedCard';box.id='slot'+i;const e=entries.find(e=>e.idx===i-start);if(e){const pic=document.createElement('img');pic.src=faceDown?'./action-back.webp':img(e.card.type,e.card.type==='heal'?e.card.power:e.card.speed);pic.onerror=()=>{if(faceDown)pic.style.background='#301311'};box.append(pic)}grid.append(box)}}
async function dealAnimation(){const el=$('#dealCard'),pic=el.querySelector('img');pic.src='./action-back.webp';el.style.display='block';for(let i=0;i<Math.min(state.players[0].hand.length,5);i++){el.style.transition='none';el.style.left='24%';el.style.top='76%';el.style.opacity='1';el.style.transform='scale(.8)';await wait(40);el.style.transition='transform .38s,opacity .38s,left .38s,top .38s';el.style.left=(25+i*12)+'%';el.style.top='90%';el.style.transform='scale(1)';el.style.opacity='0';await wait(120)}el.style.display='none'}
async function nextWanted(){if(!state.wanted.length){endGame('I 20 ricercati sono terminati. Vince chi ha più crediti.');return}let [name,value,power]=state.wanted.pop();state.current={name,value,power,hp:state.players.length*5,maxHp:state.players.length*5};state.round++;state.players.forEach(p=>{if(p.hp>0)refill(p)});selected=-1;setSlots([]);render();status('NUOVA TAGLIA: '+name+' · '+value+' CREDITI');locked=true;await dealAnimation();locked=false;render();status('SCEGLI UNA CARTA DALLA TUA MANO')}
async function start(n){const names=['JAX',...shuffle(hunters.filter(x=>x!=='JAX')).slice(0,n-1)];state={players:names.map((name,i)=>({name,hp:5,credits:0,bounties:0,hand:[],bot:i>0})),deck:attackDeck(),discard:[],wanted:shuffle(wantedData),current:null,round:0,over:false};$('#subMenu').classList.remove('show');showScreen('board');await wait(750);await nextWanted()}
function botPick(p){if(!p.hand.length)return -1;let ranked=p.hand.map((c,i)=>({c,i,score:c.type==='heal'?(p.hp<=2?10:0)+c.power:c.power+0.25*c.speed})).sort((a,b)=>b.score-a.score);return Math.random()<.2?Math.floor(Math.random()*p.hand.length):ranked[0].i}
function duelDraw(p){if(!p.hand.length)return {speed:0,empty:true};const i=p.bot?botPick(p):Math.floor(Math.random()*p.hand.length);const c=p.hand.splice(i,1)[0];state.discard.push(c);return {speed:c.type==='heal'?0:c.speed,empty:false}}
async function resolveDuels(entries){let groups=Object.groupBy?Object.groupBy(entries,e=>e.card.type==='heal'?'heal':e.card.speed):null;if(!groups){groups={};entries.forEach(e=>(groups[e.card.type==='heal'?'heal':e.card.speed]??=[]).push(e))}for(const [key,g] of Object.entries(groups)){if(key==='heal'||g.length<2)continue;let unresolved=[g],order=[];let limit=0;while(unresolved.length&&limit++<100){let next=[];for(const tied of unresolved){if(tied.length===1){order.push(tied[0]);continue}status('DUELLO: VELOCITÀ '+key);let drawn=tied.map(e=>({e,...duelDraw(state.players[e.idx])}));if(drawn.every(x=>x.empty)){drawn.forEach(x=>{const c=draw();if(c)state.players[x.e.idx].hand.push(c)});drawn=tied.map(e=>({e,...duelDraw(state.players[e.idx])}))}const speeds=[...new Set(drawn.map(x=>x.speed))].sort((a,b)=>b-a);for(const speed of speeds)next.push(drawn.filter(x=>x.speed===speed).map(x=>x.e));await wait(300)}unresolved=next.filter(a=>a.length>1);order.push(...next.filter(a=>a.length===1).flat())}g.forEach(e=>e.duelRank=order.indexOf(e));if(order.length!==g.length)g.forEach((e,i)=>e.duelRank=i)}return entries.sort((a,b)=>{if(a.card.type==='heal'&&b.card.type!=='heal')return 1;if(b.card.type==='heal'&&a.card.type!=='heal')return -1;return b.card.speed-a.card.speed||(a.duelRank??0)-(b.duelRank??0)})}
async function shoot(slot){const el=document.createElement('div');el.className='bullet';el.style.left=(17+slot*22)+'%';el.style.top='60%';$('#effectLayer').append(el);await wait(320);el.remove();const imp=document.createElement('div');imp.className='impact';imp.textContent='✹';$('#effectLayer').append(imp);setTimeout(()=>imp.remove(),550)}
async function play(){if(locked||selected<0)return;locked=true;const entries=[];state.players.forEach((p,idx)=>{if(p.hp<=0)return;const k=idx===0?selected:botPick(p);if(k<0)return;const card=p.hand.splice(k,1)[0];entries.push({idx,card});state.discard.push(card)});selected=-1;setSlots(entries,true);render();status('CARTE GIOCATE COPERTE');await wait(850);setSlots(entries,false);document.querySelectorAll('.playedCard img').forEach(x=>x.parentElement.classList.add('reveal'));status('CARTE RIVELATE');await wait(2000);await resolveDuels(entries);let capture=null;for(const e of entries){const p=state.players[e.idx];if(p.hp<=0)continue;const start=state.players.length===2?1:0;const slot=e.idx+start;const cardEl=$('#slot'+slot);cardEl?.classList.add('fire');if(e.card.type==='heal'){p.hp=Math.min(5,p.hp+e.card.power);status(p.name+' RECUPERA '+e.card.power+' VITA')}else if(state.current.hp>0){status(p.name+' SPARA! −'+e.card.power+' VITA');await shoot(slot);state.current.hp=Math.max(0,state.current.hp-e.card.power);if(state.current.hp===0){capture=p}}render();await wait(1000);cardEl?.classList.remove('fire');if(capture)break}if(capture){capture.bounties++;capture.credits+=state.current.value;render();await modal('TAGLIA CATTURATA',capture.name+' cattura '+state.current.name+'!\n+'+state.current.value+' CREDITI');if(capture.bounties>=10){endGame(capture.name+' ha catturato 10 taglie.');return}await nextWanted();return}else{const attacks=entries.filter(e=>e.card.type==='attack'&&state.players[e.idx].hp>0);if(attacks.length){const target=attacks[attacks.length-1];const p=state.players[target.idx];status(state.current.name+' CONTRATTACCA '+p.name+'!');await wait(500);p.hp=Math.max(0,p.hp-state.current.power);render();await wait(650)}}const alive=state.players.filter(p=>p.hp>0);if(alive.length<=1){endGame(alive[0]?alive[0].name+' è l’ultimo cacciatore vivo.':'Nessun cacciatore sopravvissuto.');return}if(state.players[0].hp<=0){endGame('Sei stato eliminato.');return}state.players.forEach(p=>{if(p.hp>0)refill(p)});selected=-1;setSlots([]);render();await dealAnimation();locked=false;status('SCEGLI UNA CARTA DALLA TUA MANO');render()}
$('#newBtn').onclick=()=>$('#subMenu').classList.add('show');$('#cancelMenu').onclick=()=>$('#subMenu').classList.remove('show');document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>start(Number(b.dataset.n)));$('#playBtn').onclick=play;$('#continueBtn').onclick=()=>{try{state=JSON.parse(localStorage.getItem('galaxy-outlaws-save-v5'));if(!state)throw Error();locked=false;selected=-1;showScreen('board');setSlots([]);render();status('PARTITA RIPRESA')}catch(e){$('#subMenu').classList.add('show')}};$('#settingsBtn').onclick=()=>$('#settings').classList.add('show');$('#closeSettings').onclick=()=>$('#settings').classList.remove('show');$('#animToggle').onchange=e=>anim=e.target.checked;$('#backMenu').onclick=()=>modal('PAUSA','Vuoi tornare al menu? La partita viene salvata.','TORNA AL MENU').then(()=>showScreen('menu'));
</script></body></html>
